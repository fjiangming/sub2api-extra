services:
  usage-leaderboard:
    profiles: [usage-leaderboard]
    image: ${USAGE_LEADERBOARD_IMAGE:-ghcr.io/fjiangming/sub2api-extra:usage-leaderboard-latest}
    build:
      context: .
    container_name: ${USAGE_LEADERBOARD_CONTAINER_NAME:-sub2api-usage-leaderboard}
    restart: ${USAGE_LEADERBOARD_RESTART_POLICY:-unless-stopped}
    ports:
      - "127.0.0.1:${USAGE_LEADERBOARD_PORT:-9876}:9876"
    environment:
      NODE_ENV: production
      USAGE_LEADERBOARD_BIND_HOST: "0.0.0.0"
      USAGE_LEADERBOARD_PORT: "9876"
    env_file:
      - path: ./.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9876/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    # Optional bounded admin settings; also set USAGE_LEADERBOARD_SETTINGS_DIR.
    # volumes:
    #   - ./settings:/app/settings
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
