<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>降智检测配置</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin/config.css">
  <script src="/vendor/lucide/lucide.min.js" defer></script>
  <script src="/admin/config.js" defer></script>
</head>
<body>
  <div id="loading-view" class="state-view">
    <span class="spinner" aria-hidden="true"></span>
    <p>正在读取检测配置</p>
  </div>

  <div id="error-view" class="state-view" hidden>
    <span class="state-icon"><i data-lucide="shield-alert"></i></span>
    <h1>无法打开管理页面</h1>
    <p id="error-message"></p>
    <a class="button" href="/results"><i data-lucide="arrow-left"></i><span>查看检测结果</span></a>
  </div>

  <main id="app-view" class="app-shell admin-shell" hidden>
    <header class="page-header admin-header">
      <div class="page-title">
        <a class="icon-button back-button" href="/results" title="查看检测结果" aria-label="查看检测结果">
          <i data-lucide="arrow-left"></i>
        </a>
        <span class="page-mark" aria-hidden="true"><i data-lucide="settings-2"></i></span>
        <div>
          <h1>降智检测配置</h1>
          <p id="page-meta">管理员配置</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="user-chip"><i data-lucide="shield-check"></i><span id="user-name"></span></span>
        <button id="save-button" class="button primary" type="submit" form="config-form">
          <i data-lucide="save"></i><span>保存配置</span>
        </button>
      </div>
    </header>

    <form id="config-form" autocomplete="off">
      <section class="schedule-band" aria-labelledby="schedule-title">
        <div class="section-heading">
          <span class="section-icon"><i data-lucide="clock-3"></i></span>
          <div><h2 id="schedule-title">自动检测计划</h2><p id="schedule-next">Asia/Shanghai</p></div>
        </div>
        <div class="schedule-editor">
          <div class="schedule-mode-switch" role="radiogroup" aria-label="自动检测计划类型">
            <label>
              <input type="radio" name="schedule-mode" value="daily" checked>
              <span><i data-lucide="calendar-clock"></i>固定时间</span>
            </label>
            <label>
              <input type="radio" name="schedule-mode" value="interval">
              <span><i data-lucide="timer-reset"></i>间隔执行</span>
            </label>
          </div>
          <div id="schedule-daily-fields" class="schedule-fields">
            <span class="schedule-field-label">每日执行</span>
            <div id="schedule-times" class="schedule-times"></div>
            <button id="schedule-time-add" class="icon-button schedule-time-add" type="button"
              title="添加执行时间" aria-label="添加执行时间"><i data-lucide="plus"></i></button>
          </div>
          <div id="schedule-interval-fields" class="schedule-fields" hidden>
            <span class="schedule-field-label">每隔</span>
            <label class="interval-field">
              <input id="schedule-interval-value" type="number" min="1" required aria-label="检测间隔">
              <select id="schedule-interval-unit" aria-label="检测间隔单位">
                <option value="minutes">分钟</option>
                <option value="hours">小时</option>
                <option value="days">天</option>
              </select>
            </label>
          </div>
        </div>
      </section>

      <section class="platform-workspace" aria-labelledby="platform-title">
        <div class="workspace-head">
          <div>
            <h2 id="platform-title">被检平台与分组</h2>
            <p id="platform-summary"></p>
          </div>
          <nav id="platform-tabs" class="platform-tabs" aria-label="被检平台"></nav>
        </div>
        <div id="platform-panels"></div>
      </section>
    </form>
  </main>

  <dialog id="history-dialog" class="history-modal" aria-labelledby="history-title">
    <header class="history-modal-head">
      <div>
        <h2 id="history-title">历史检测记录</h2>
        <p id="history-meta"></p>
      </div>
      <button id="history-close" class="icon-button" type="button" title="关闭" aria-label="关闭历史记录">
        <i data-lucide="x"></i>
      </button>
    </header>
    <div class="history-toolbar">
      <label class="history-select-all">
        <input id="history-select-all" type="checkbox">
        <span>全选当前列表</span>
      </label>
      <span id="history-selection" class="history-selection">已选择 0 条</span>
      <div class="history-actions">
        <button id="history-delete-selected" class="button danger" type="button" disabled>
          <i data-lucide="trash-2"></i><span>删除选中</span>
        </button>
        <button id="history-clear-all" class="button danger" type="button" disabled>
          <i data-lucide="list-x"></i><span>清空该分组</span>
        </button>
      </div>
    </div>
    <div id="history-list" class="history-list" aria-live="polite"></div>
    <footer class="history-modal-foot">
      <button id="history-load-more" class="button" type="button" hidden>
        <i data-lucide="chevrons-down"></i><span>加载更早记录</span>
      </button>
    </footer>
  </dialog>

  <dialog id="review-dialog" class="review-modal" aria-labelledby="review-title">
    <form id="review-form">
      <header class="review-modal-head">
        <div>
          <h2 id="review-title">人工复核检测状态</h2>
          <p id="review-meta"></p>
        </div>
        <button id="review-close" class="icon-button" type="button" title="关闭" aria-label="关闭人工复核">
          <i data-lucide="x"></i>
        </button>
      </header>
      <div class="review-modal-body">
        <section class="review-automatic" aria-labelledby="review-automatic-title">
          <div><span id="review-automatic-title">自动判定</span><span id="review-automatic-status"></span></div>
          <p id="review-automatic-reason"></p>
        </section>
        <fieldset class="review-status-field">
          <legend>人工状态</legend>
          <div class="review-status-options">
            <label data-status="normal">
              <input type="radio" name="review-status" value="normal" required>
              <span><i data-lucide="circle-check"></i>正常</span>
            </label>
            <label data-status="degraded">
              <input type="radio" name="review-status" value="degraded" required>
              <span><i data-lucide="circle-x"></i>疑似降智</span>
            </label>
            <label data-status="unknown">
              <input type="radio" name="review-status" value="unknown" required>
              <span><i data-lucide="circle-help"></i>无法判定</span>
            </label>
          </div>
        </fieldset>
        <label class="field review-reason-field">
          <span>复核理由</span>
          <textarea id="review-reason" required minlength="2" maxlength="500"></textarea>
        </label>
      </div>
      <footer class="review-modal-foot">
        <button id="review-clear" class="button" type="button">
          <i data-lucide="rotate-ccw"></i><span>撤销人工复核</span>
        </button>
        <span></span>
        <button id="review-cancel" class="button" type="button">取消</button>
        <button id="review-save" class="button primary" type="submit">
          <i data-lucide="check"></i><span>保存复核</span>
        </button>
      </footer>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="confirm-modal" aria-labelledby="confirm-title">
    <span class="confirm-icon" aria-hidden="true"><i data-lucide="triangle-alert"></i></span>
    <div>
      <h2 id="confirm-title">确认删除历史记录</h2>
      <p id="confirm-message"></p>
    </div>
    <div class="confirm-actions">
      <button id="confirm-cancel" class="button" type="button">取消</button>
      <button id="confirm-accept" class="button danger" type="button">
        <i data-lucide="trash-2"></i><span>确认删除</span>
      </button>
    </div>
  </dialog>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
