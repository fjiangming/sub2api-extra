name: Operations Center Dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-center-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: operations-center/package-lock.json
      - run: npm ci
        working-directory: operations-center
      - run: npm run check
        working-directory: operations-center
      - run: npm test
        working-directory: operations-center

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: operations-center
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/fjiangming/sub2api-extra:operations-center-dev-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/fjiangming/sub2api-extra
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=operations-center-dev-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=operations-center-dev-${{ matrix.arch }}
      - name: Verify native SQLite and image revision
        env:
          IMAGE: ghcr.io/fjiangming/sub2api-extra@${{ steps.image.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm --entrypoint node -e EXPECTED_ARCH="$EXPECTED_ARCH" "$IMAGE" -e '
            const assert = require("node:assert/strict");
            assert.equal(process.arch,process.env.EXPECTED_ARCH === "amd64" ? "x64" : "arm64");
            const db = new (require("better-sqlite3"))(":memory:");
            assert.equal(db.prepare("SELECT 1 value").get().value,1); db.close();
            require("./src/conversation-log-store");
          '
          revision=$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          [[ "$revision" = "$GITHUB_SHA" ]]

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested multi-platform dev manifest
        run: |
          set -euo pipefail
          image=ghcr.io/fjiangming/sub2api-extra
          version="operations-center-dev-$GITHUB_SHA"
          docker buildx imagetools create --tag "$image:$version" "$image:$version-amd64" "$image:$version-arm64"
          if [[ "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA" ]]; then
            docker buildx imagetools create --tag "$image:operations-center-dev" "$image:$version"
          fi
          docker buildx imagetools inspect "$image:$version"
