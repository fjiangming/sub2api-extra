<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>活动中心</title>
  <link rel="stylesheet" href="./styles.css?v=6">
  <script src="./vendor/lucide.js" defer></script>
  <script src="./compensation-admin.js?v=2" defer></script>
  <script src="./app.js?v=8" defer></script>
</head>
<body>
  <div class="app">
    <div id="page-status" class="page-status" role="status"><p id="status-copy">正在加载活动中心</p><button id="retry-page" class="button" hidden><i data-lucide="refresh-cw"></i>重新加载</button><a id="login-link" class="button" hidden>前往主站</a></div>
    <main id="activity-view" hidden>
      <div class="page-heading"><h1>活动中心</h1><div id="admin-entry"></div></div>
      <nav id="activity-tabs" class="tabs" role="tablist" aria-label="活动"></nav>
      <section id="lottery-panel" class="content" role="tabpanel" aria-labelledby="lottery-tab">
        <div class="activity-heading"><h2>充值抽奖</h2></div>
        <div id="activity-error" class="error" role="alert" hidden></div>
        <div class="lottery-main">
          <div class="wheel-area"><div class="wheel-frame"><canvas id="wheel" width="720" height="720" role="img" aria-label="抽奖转盘，奖品为0.5、1、2、3、5、10、20、50元"></canvas><span class="pointer" aria-hidden="true"></span><span class="hub" aria-hidden="true"><i data-lucide="gift"></i>好运</span></div></div>
          <div class="lottery-side">
            <p class="lottery-rule">每累计充值 50 元获得 1 次抽奖机会，奖励即时到账</p>
            <div class="muted">可用抽奖次数</div><div class="chance-value"><strong id="available">0</strong><span class="muted">次</span></div>
            <div class="mini-stats"><div><div class="mini-label">累计获得</div><div id="my-total" class="mini-value">¥0.00</div></div><div><div class="mini-label">已抽次数</div><div id="my-draws" class="mini-value">0 次</div></div></div>
            <div id="outcome" class="outcome" role="status" aria-live="polite"><span class="muted">好运即将揭晓</span></div>
            <button id="single-draw" class="button primary draw" data-count="1" disabled><i data-lucide="rotate-cw"></i>抽一次</button>
            <div class="batches"><button class="button" data-count="10" disabled>连抽 10 次</button><button class="button" data-count="20" disabled>连抽 20 次</button><button class="button" data-count="50" disabled>连抽 50 次</button></div>
            <button id="recover-draw" class="button" hidden><i data-lucide="refresh-cw"></i>恢复抽奖结果</button>
          </div>
        </div>
        <section class="personal"><div class="section-heading"><h2>我的奖励</h2><button id="refresh-rewards" class="icon-button" title="刷新奖励记录" aria-label="刷新奖励记录"><i data-lucide="refresh-cw"></i></button></div>
          <table class="table"><thead><tr><th>时间</th><th>奖励</th><th>状态</th></tr></thead><tbody id="my-rewards"></tbody></table>
          <div class="pagination"><span id="my-page"></span><button id="my-prev" class="icon-button" title="上一页" aria-label="上一页"><i data-lucide="chevron-left"></i></button><button id="my-next" class="icon-button" title="下一页" aria-label="下一页"><i data-lucide="chevron-right"></i></button></div>
        </section>
      </section>
    </main>
    <main id="admin-view" hidden></main>
  </div>
  <dialog id="detail-dialog"><div class="dialog-heading"><h2 id="dialog-title">奖励详情</h2><button id="close-dialog" class="icon-button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><div id="dialog-body"></div></dialog>
</body>
</html>
