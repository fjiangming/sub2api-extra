<div class="admin-title"><button id="back-activity" class="icon-button" title="返回活动中心" aria-label="返回活动中心"><i data-lucide="arrow-left"></i></button><div class="admin-nav" role="tablist" aria-label="管理员功能"><button id="admin-ledger-tab" class="admin-nav-button active" role="tab" aria-selected="true">奖励账本</button><button id="admin-compensation-tab" class="admin-nav-button" role="tab">补偿机会</button></div><button id="refresh-ledger" class="icon-button" title="刷新账本" aria-label="刷新账本"><i data-lucide="refresh-cw"></i></button></div>
<div class="content">
  <div id="ledger-error" class="error" role="alert" hidden></div>
  <div class="ledger-stats"><div><span class="mini-label">累计已发放</span><strong id="ledger-total">¥0.00</strong></div><div><span class="mini-label">今日已发放</span><strong id="ledger-today">¥0.00</strong></div><div><span class="mini-label">获奖用户</span><strong id="ledger-users">0</strong></div><div><span class="mini-label">已入账笔数</span><strong id="ledger-paid">0</strong></div></div>
  <div id="ledger-unsettled" class="unsettled"></div>
  <section id="ledger-audit" class="ledger-audit" aria-labelledby="audit-heading">
    <h2 id="audit-heading">门槛审计</h2>
    <div id="audit-summary" class="audit-summary" role="status" aria-live="polite">正在核验奖励记录</div>
    <div class="audit-actions">
      <button id="view-audit-violations" class="button" hidden><i data-lucide="list-filter"></i>查看未达门槛</button>
      <button id="view-audit-unverifiable" class="button" hidden><i data-lucide="file-search"></i>查看待核查</button>
    </div>
  </section>
  <section id="lottery-config" class="lottery-config" aria-labelledby="lottery-config-heading">
    <div class="section-heading"><div><h2 id="lottery-config-heading">充值抽奖规则</h2><p class="field-help">管理员可调整基础概率和累计有效充值门槛；新抽奖使用保存后的规则，历史奖励保留原门槛快照。</p></div><span id="lottery-config-version" class="row-sub"></span></div>
    <form id="lottery-config-form">
      <div class="ledger-scroll"><table class="table lottery-config-table"><thead><tr><th>奖品</th><th>基础概率</th><th>累计有效充值门槛</th></tr></thead><tbody id="lottery-config-rows"></tbody></table></div>
      <div class="probability-footer"><span id="lottery-config-total" class="total-good">总概率 100%</span><span class="field-help">概率总和必须为 100%；门槛按人民币元填写，0 表示无门槛。</span><button class="button primary" type="submit"><i data-lucide="save"></i>保存充值抽奖规则</button></div>
      <div id="lottery-config-feedback" class="feedback" role="status" aria-live="polite"></div>
    </form>
  </section>
  <section class="ledger-section"><h2>奖励明细</h2>
    <form id="ledger-filters" class="filters">
      <label class="field search">用户 / 邮箱 / 流水号<input name="query" maxlength="320" type="search" placeholder="搜索奖励记录"></label>
      <label class="field">开始日期<input name="from" type="date"></label>
      <label class="field">结束日期<input name="to" type="date"></label>
      <label class="field">入账状态<select name="status"><option value="">全部状态</option><option value="paid">已入账</option><option value="pending">待入账</option><option value="failed">入账异常</option></select></label>
      <label class="field">门槛审计<select name="audit"><option value="">全部结果</option><option value="violation">未达门槛</option><option value="unverifiable">待核查</option><option value="passed">已达门槛</option><option value="not_required">无需门槛</option></select></label>
      <label class="field">抽奖来源<select name="source"><option value="">全部来源</option><option value="recharge">充值机会</option><option value="compensation">补偿机会</option></select></label>
      <div class="filter-actions"><button class="icon-button" type="submit" title="筛选" aria-label="筛选"><i data-lucide="search"></i></button><button id="clear-filters" class="icon-button" type="button" title="清空筛选" aria-label="清空筛选"><i data-lucide="filter-x"></i></button></div>
    </form>
    <div class="ledger-scroll"><table class="table ledger-table"><thead><tr><th>用户</th><th>奖励</th><th>来源</th><th>活动</th><th>时间</th><th>状态</th><th>门槛审计</th><th>详情</th></tr></thead><tbody id="ledger-rows"></tbody></table></div>
    <div class="pagination"><span id="ledger-page"></span><button id="ledger-prev" class="icon-button" title="上一页" aria-label="上一页"><i data-lucide="chevron-left"></i></button><button id="ledger-next" class="icon-button" title="下一页" aria-label="下一页"><i data-lucide="chevron-right"></i></button></div>
  </section>
</div>
