<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <title>访问地址已更新 · https://yunhop.cc</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="demo.css">
  <script src="../../node_modules/lucide/dist/umd/lucide.min.js" defer></script>
  <script src="demo.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="https://yunhop.cc/" rel="noreferrer" aria-label="yunhop 新站首页">
        <span class="brand-mark" aria-hidden="true"><i data-lucide="arrow-up-right"></i></span>
        <span>yunhop<span class="brand-period">.</span></span>
      </a>
      <span class="header-note"><span class="status-dot" aria-hidden="true"></span>服务通知</span>
    </div>
  </header>

  <main>
    <section class="migration" aria-labelledby="page-title">
      <div class="notice-mark" aria-hidden="true"><i data-lucide="globe-2"></i></div>
      <p class="eyebrow">访问地址已更新</p>
      <h1 id="page-title"><span class="heading-protocol">https://</span><span>yunhop.cc</span></h1>
      <p class="intro">熟悉的服务，新的地址。<br>请前往新域名继续访问，并更新你的收藏夹。</p>

      <div class="address-route" aria-label="域名变更">
        <div class="address-row old-address">
          <span class="address-icon" aria-hidden="true"><i data-lucide="link-2"></i></span>
          <div class="address-content">
            <p class="address-label">原访问地址</p>
            <p class="address-value" id="source-url">https://epoint2api.fjmooo.cn/</p>
          </div>
        </div>
        <div class="route-connector" aria-hidden="true"><i data-lucide="arrow-down"></i></div>
        <div class="address-row new-address">
          <span class="address-icon" aria-hidden="true"><i data-lucide="circle-check"></i></span>
          <div class="address-content">
            <p class="address-label">新访问地址</p>
            <a class="address-value destination" id="destination-url" href="https://yunhop.cc/" rel="noreferrer"><span class="destination-host">https://yunhop.cc</span><span class="destination-path" id="destination-path">/</span></a>
          </div>
          <span class="copy-control" hidden id="copy-control">
            <button class="icon-button" type="button" id="copy-address" aria-label="复制新地址" aria-describedby="copy-tooltip">
              <i data-lucide="copy" aria-hidden="true"></i>
            </button>
            <span class="tooltip" id="copy-tooltip" role="tooltip">复制新地址</span>
          </span>
        </div>
      </div>

      <div class="actions">
        <a class="primary-action" id="continue-link" href="https://yunhop.cc/" rel="noreferrer">
          <span>前往 https://yunhop.cc</span><i data-lucide="arrow-up-right" aria-hidden="true"></i>
        </a>
        <a class="home-link" id="home-link" href="https://yunhop.cc/" rel="noreferrer" hidden><i data-lucide="house" aria-hidden="true"></i><span>新站首页</span></a>
      </div>
      <p class="copy-result" id="copy-result" role="status" aria-live="polite" aria-atomic="true"></p>

      <div class="api-note">
        <i data-lucide="code-2" aria-hidden="true"></i>
        <p>使用 API 客户端？请将访问地址更新为 <span>https://yunhop.cc</span>，保留原有接口路径。</p>
      </div>
      <noscript><p class="noscript-note">请点击上方按钮前往新站首页。</p></noscript>
    </section>
  </main>

  <footer class="site-footer">
    <span>https://yunhop.cc</span>
    <span>感谢你的理解与支持</span>
  </footer>
</body>
</html>
