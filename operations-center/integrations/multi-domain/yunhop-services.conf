# HTTP origin stays available; HTTPS :8443 is ready for a later Cloudflare switch.
map $http_upgrade $yunhop_connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    include /etc/nginx/snippets/yunhop-tls.conf;
    server_name yunhop.cc www.yunhop.cc;
    client_max_body_size 100m;
    underscores_in_headers on;
    include /etc/nginx/snippets/aihub-maintenance-switch.conf;
    include /etc/nginx/snippets/infinite-canvas-main.conf;

    location = /shop { return 302 https://pay.ldxp.cn/shop/4MTZZD22; }
    location = /shop/ { return 302 https://pay.ldxp.cn/shop/4MTZZD22; }
    location = /monitor { return 302 https://$host/monitor/$is_args$args; }
    location ^~ /monitor/ {
        include /etc/nginx/snippets/yunhop-proxy.conf;
        proxy_pass http://127.0.0.1:9871/;
        proxy_set_header X-Forwarded-Prefix /monitor;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
        sub_filter 'href="/styles.css"' 'href="/monitor/styles.css"';
        sub_filter 'src="/vendor/' 'src="/monitor/vendor/';
        sub_filter 'src="/app.js"' 'src="/monitor/app.js"';
        sub_filter '/api/' '/monitor/api/';
        proxy_redirect / /monitor/;
        proxy_cookie_path / /monitor/;
    }
    location / {
        include /etc/nginx/snippets/yunhop-proxy.conf;
        proxy_pass http://127.0.0.1:9000;
        proxy_ignore_client_abort on;
        proxy_send_timeout 1860s;
        proxy_read_timeout 1860s;
        send_timeout 1860s;
    }
}

