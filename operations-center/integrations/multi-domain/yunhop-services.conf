server {
    include /etc/nginx/snippets/yunhop-tls.conf;
    server_name canvas.yunhop.cc;
    client_max_body_size 100m;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://aihub.fo2.us.ci https://aihubdirect.fo2.us.ci https://epoint2api.fjmooo.cn https://yunhop.cc https://www.yunhop.cc" always;
    add_header Cache-Control "no-store" always;
    if ($infinite_canvas_login_query) { return 302 https://$host$uri; }
    location ~ ^/(v1|v1beta)/ {
        include /etc/nginx/snippets/yunhop-proxy.conf;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_cache off;
    }
    location / {
        include /etc/nginx/snippets/yunhop-proxy.conf;
        proxy_pass http://127.0.0.1:9877;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
    }
}
