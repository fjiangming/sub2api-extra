# /etc/nginx/conf.d/usage-leaderboard.conf

log_format usage_leaderboard_no_args
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" '
    '$status $body_bytes_sent $request_time';

upstream usage_leaderboard_backend {
    server 127.0.0.1:9876;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name aihubrank.fo2.us.ci aihubrank.yunhop.cc;
    include /etc/nginx/snippets/yunhop-tls.conf;

    server_tokens off;
    client_max_body_size 64k;

    access_log /var/log/nginx/usage-leaderboard.access.log usage_leaderboard_no_args;
    error_log /var/log/nginx/usage-leaderboard.error.log error;

    add_header Cache-Control "no-store, private" always;

    location / {
        proxy_pass http://usage_leaderboard_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;

        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_intercept_errors off;
    }
}
