# HTTPS origin listener and certificate only; business settings remain in the original files.
listen 8443 ssl;
listen [::]:8443 ssl;
ssl_certificate /etc/nginx/ssl/yunhop.cc/origin.pem;
ssl_certificate_key /etc/nginx/ssl/yunhop.cc/origin.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:yunhop_tls:10m;
ssl_session_timeout 1d;
port_in_redirect off;
