# 不记录查询参数，避免 URL 中的令牌进入访问日志
log_format newapi_safe '$remote_addr [$time_local] '
                       '"$request_method $uri" $status $request_time';

# new-api：Cloudflare 当前通过 HTTP 回源
server {
    listen 80;
    server_name aihub.fo1.us.ci newapi.yunhop.cc;
    include /etc/nginx/snippets/yunhop-tls.conf;

    client_max_body_size 100m;

    access_log /var/log/nginx/newapi_access.log newapi_safe;
    error_log  /var/log/nginx/newapi_error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_buffering off;
    proxy_request_buffering off;

    # 初始化完成后，公网不允许再次提交初始化请求
    location = /api/setup {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

# =====================================================
# 降智检测
# detector.fo2.us.ci -> 127.0.0.1:9873
# =====================================================
server {
    listen 80;
    server_name detector.fo2.us.ci detector.yunhop.cc;
    include /etc/nginx/snippets/yunhop-tls.conf;

    client_max_body_size 1m;

    # 首次 SSO 请求包含 Token，不写入访问日志
    access_log off;
    error_log /var/log/nginx/degradation_detector_error.log warn;

    location / {
        # 不带末尾斜杠，完整保留 /results、/admin、/api 等路径
        proxy_pass http://127.0.0.1:9873;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;

        # Cloudflare 使用 HTTPS，当前通过 HTTP 回源
        # 必须告诉应用外部协议为 HTTPS，才能正确设置 Secure Cookie
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}

