# Only these browser origins may use the main/canvas model API across domains.
map $http_origin $canvas_api_origin {
    default "";
    "https://aihub.fo2.us.ci" $http_origin;
    "https://aihubdirect.fo2.us.ci" $http_origin;
    "https://epoint2api.fjmooo.cn" $http_origin;
    "https://yunhop.cc" $http_origin;
    "https://www.yunhop.cc" $http_origin;
    "https://canvas.fo2.us.ci" $http_origin;
    "https://canvas.yunhop.cc" $http_origin;
}

map "$request_method:$canvas_api_origin" $canvas_api_preflight {
    default 0;
    ~^OPTIONS:https:// 1;
}

# =====================================================
# 处理 epoint2api.fjmooo.cn 的请求，转发到 9000 端口
# =====================================================
server {
    listen 80;
    server_name epoint2api.fjmooo.cn;
    include /etc/nginx/snippets/aihub-maintenance-switch.conf;
    client_max_body_size 100m;

    underscores_in_headers on;

    access_log /var/log/nginx/epoint2api_access.log;
    error_log /var/log/nginx/epoint2api_error.log;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_ignore_client_abort on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

	proxy_connect_timeout 30s;
        proxy_send_timeout 1860s;
        proxy_read_timeout 1860s;
        send_timeout 1860s;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}

