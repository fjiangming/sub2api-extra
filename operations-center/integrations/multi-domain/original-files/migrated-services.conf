# =====================================================
# 处理 aihub.fo2.us.ci 的请求，转发到 9000 端口
# =====================================================
server {
    listen 80;
    server_name aihub.fo2.us.ci yunhop.cc www.yunhop.cc;
    include /etc/nginx/snippets/yunhop-tls.conf;
    include /etc/nginx/snippets/infinite-canvas-main.conf;
    include /etc/nginx/snippets/aihub-maintenance-switch.conf;

    client_max_body_size 100m;

    underscores_in_headers on;

    access_log /var/log/nginx/epoint2api_access.log;
    error_log /var/log/nginx/epoint2api_error.log;

    location = /shop {
        return 302 https://pay.ldxp.cn/shop/4MTZZD22;
    }

    location = /shop/ {
        return 302 https://pay.ldxp.cn/shop/4MTZZD22;
    }

    # 补齐末尾斜杠，并保留 Sub2API 附加的登录参数
    location = /monitor {
        access_log off;
        return 302 /monitor/$is_args$args;
    }

    # Provider Monitor
    location ^~ /monitor/ {
        access_log off;

        # 末尾斜杠用于移除 /monitor/ 前缀
        proxy_pass http://127.0.0.1:9871/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix /monitor;

        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;

        # Provider Monitor 当前使用 /app.js、/api/* 等根路径，
        # 需要改写成 /monitor/*，否则请求会错误进入 9000。
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
        sub_filter 'href="/styles.css"' 'href="/monitor/styles.css"';
        sub_filter 'src="/vendor/' 'src="/monitor/vendor/';
        sub_filter 'src="/app.js"' 'src="/monitor/app.js"';
        sub_filter '/api/' '/monitor/api/';

        proxy_redirect / /monitor/;
        proxy_cookie_path / /monitor/;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~ ^/(v1|v1beta)/ {
        include /etc/nginx/snippets/sub2api-main-proxy.conf;
        include /etc/nginx/snippets/canvas-api-cors.conf;
    }

    location / {
        include /etc/nginx/snippets/sub2api-main-proxy.conf;
    }
}
# 供应商监控
