# /etc/nginx/conf.d/recharge-center.conf

include /etc/nginx/snippets/cloudflare-realip.conf;

# 不记录查询参数，避免短时登录 Token 进入源站访问日志。
log_format recharge_center_no_args
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" '
    '$status $body_bytes_sent $request_time';

upstream recharge_center_backend {
    server 127.0.0.1:9874;
    keepalive 16;
}

server {
    # Flexible 模式下，Cloudflare 通过 HTTP 访问源站。
    listen 80;
    listen [::]:80;
    server_name aihubpay.fo2.us.ci aihubpay.yunhop.cc;
    include /etc/nginx/snippets/yunhop-tls.conf;

    server_tokens off;
    client_max_body_size 64k;

    access_log /var/log/nginx/recharge-center.access.log recharge_center_no_args;
    error_log /var/log/nginx/recharge-center.error.log error;

    # 明确禁止 Cloudflare 和浏览器缓存充值页面、二维码及接口响应。
    add_header Cache-Control "no-store, private" always;

    location / {
        proxy_pass http://recharge_center_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;

        # 用户访问 Cloudflare 时是 HTTPS，虽然 Cloudflare 到源站是 HTTP。
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # $remote_addr 已由 cloudflare-realip.conf 恢复为真实用户地址。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
