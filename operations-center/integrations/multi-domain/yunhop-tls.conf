listen 80;
listen [::]:80;
listen 8443 ssl;
listen [::]:8443 ssl;
ssl_certificate /etc/nginx/ssl/yunhop.cc/origin.pem;
ssl_certificate_key /etc/nginx/ssl/yunhop.cc/origin.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:yunhop_tls:10m;
ssl_session_timeout 1d;
proxy_connect_timeout 30s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;
send_timeout 600s;
server_tokens off;
port_in_redirect off;
access_log off;
error_log /var/log/nginx/yunhop-error.log crit;
