# Adapt the Nginx reopen PID/service and reader group to the server.
# Rename + reopen is preferred over copytruncate, which can lose writes during copying.
/var/log/nginx/domain-access/domain-access.jsonl {
    daily
    maxsize 100M
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data operations-log-readers
    sharedscripts
    postrotate
        test ! -f /run/nginx.pid || kill -USR1 "$(cat /run/nginx.pid)"
    endscript
}
