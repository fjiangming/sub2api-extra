# Include once inside Nginx's http {} context.
# Only route categories are logged; query strings and arbitrary path segments are excluded.
map $uri $operations_domain_path {
    default /web/*;
    / /;
    ~^/(v1|api/v1)/(messages|chat/completions|responses|models|embeddings|images/generations|audio/transcriptions)/?$ $uri;
    ~^/v1beta/models/ /v1beta/models/*;
    ~^/v1/ /v1/*;
    ~^/api/ /api/*;
}

log_format operations_domain_json escape=json
    '{"version":1,"source":"operations-domain-gateway",'
    '"at":"$time_iso8601","host":"$http_host",'
    '"gateway_id":"$request_id","backend_id":"$upstream_http_x_request_id",'
    '"method":"$request_method","path":"$operations_domain_path","status":$status}';
